description = "Agora Conversational AI Gemini MLLM model comparison demo"
requires-python = ">=3.10"
dependencies = [
    "agora-agents==2.9.0",
    "fastapi>=0.100.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
